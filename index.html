<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CHUB - Flowchart Studio</title>
  <style>
    :root {
      --bg-color: #0b0c10;
      --card-bg: #15171e;
      --card-border: #262933;
      --text-main: #f0f2f5;
      --text-sub: #8a8f9d;
      --node-bg: #1c1f2b;
      --node-border: #3b3f52;
      --accent-blue: #3483fa;
      --accent-hover: #2563eb;
      --arrow-color: #6c7280;
      --arrow-delete: #ff4d4d;
      --anchor-color: #00ffcc;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    /* TELAS DA APLICAÇÃO */
    .screen { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; display: flex; flex-direction: column; opacity: 0; visibility: hidden; transition: opacity 0.3s ease, visibility 0.3s ease; }
    .screen.active { opacity: 1; visibility: visible; }

    /* TELAS ESPECÍFICAS */
    #home-screen { align-items: center; justify-content: center; cursor: pointer; z-index: 30; }
    .chub-card { background-color: var(--card-bg); border: 1.5px solid var(--card-border); width: 280px; height: 160px; border-radius: 16px; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 30px rgba(0,0,0,0.6); transition: transform 0.2s ease, border-color 0.2s ease; }
    .chub-card:hover { transform: translateY(-4px); border-color: var(--accent-blue); }
    .chub-card h1 { font-size: 2.2rem; font-weight: 700; letter-spacing: 4px; color: var(--text-main); }

    /* DASHBOARD DE PASTAS */
    #folders-screen { background-color: var(--bg-color); padding: 40px; overflow-y: auto; z-index: 20; }
    .folders-header { display: flex; justify-content: space-between; align-items: center; max-width: 1100px; margin: 0 auto 32px auto; width: 100%; border-bottom: 1px solid var(--card-border); padding-bottom: 20px; }
    .folders-title h2 { font-size: 1.8rem; font-weight: 700; letter-spacing: 1px; }
    .folders-title p { color: var(--text-sub); font-size: 0.9rem; margin-top: 4px; }
    .folders-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 24px; max-width: 1100px; margin: 0 auto; width: 100%; }
    
    .folder-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 14px; padding: 20px; cursor: pointer; position: relative; display: flex; flex-direction: column; justify-content: space-between; height: 160px; transition: all 0.2s ease; }
    .folder-card:hover { border-color: var(--accent-blue); transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,0.4); }
    .folder-top { display: flex; justify-content: space-between; align-items: flex-start; }
    .folder-icon { font-size: 2rem; color: var(--accent-blue); }
    .folder-delete { background: transparent; border: none; color: var(--text-sub); font-size: 1.1rem; cursor: pointer; opacity: 0; transition: opacity 0.2s; padding: 4px; }
    .folder-card:hover .folder-delete { opacity: 1; }
    .folder-delete:hover { color: var(--arrow-delete); }
    .folder-info .folder-name { font-size: 1.1rem; font-weight: 600; color: var(--text-main); margin-bottom: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .folder-info .folder-category { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; color: var(--accent-blue); background: rgba(52, 131, 250, 0.1); padding: 4px 8px; border-radius: 6px; display: inline-block; }

    /* CANVAS DO FLUXOGRAMA */
    #flowchart-screen { z-index: 10; }
    header { padding: 12px 24px; border-bottom: 1px solid var(--card-border); display: flex; align-items: center; justify-content: space-between; background-color: rgba(21, 23, 30, 0.95); z-index: 100; }
    .header-left { display: flex; align-items: center; gap: 16px; }
    .active-folder-tag { font-size: 0.85rem; color: var(--accent-blue); background: rgba(52, 131, 250, 0.15); padding: 4px 10px; border-radius: 6px; font-weight: 600; }
    .toolbar { display: flex; gap: 10px; align-items: center; }
    .zoom-indicator, .db-status { font-size: 0.85rem; color: var(--text-sub); margin-left: 10px; }
    .db-status { color: #00ffcc; font-weight: bold; }
    
    .btn { background: var(--node-bg); border: 1px solid var(--card-border); color: var(--text-main); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; font-weight: 500; transition: background 0.2s, border-color 0.2s; }
    .btn:hover, .btn.active { border-color: var(--accent-blue); background: #252938; }
    .btn-primary { background: var(--accent-blue); border-color: var(--accent-blue); color: #fff; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-save { border-color: #2e7d32; background: #1b5e20; }
    .btn-save:hover { background: #2e7d32; }
    .btn-back { background: transparent; border: 1px solid var(--card-border); color: var(--text-sub); }

    /* MODAIS */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.75); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 1000; opacity: 0; visibility: hidden; transition: opacity 0.2s ease; }
    .modal-overlay.active { opacity: 1; visibility: visible; }
    .modal { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 28px; width: 100%; max-width: 400px; box-shadow: 0 20px 40px rgba(0,0,0,0.8); }
    .modal h3 { margin-bottom: 8px; font-size: 1.3rem; }
    .modal p { color: var(--text-sub); font-size: 0.85rem; margin-bottom: 20px; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 0.8rem; color: var(--text-sub); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
    .form-group input { width: 100%; background: var(--node-bg); border: 1px solid var(--card-border); padding: 10px 12px; border-radius: 8px; color: var(--text-main); font-size: 0.95rem; outline: none; }
    .form-group input:focus { border-color: var(--accent-blue); }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 24px; }
    .error-msg { color: var(--arrow-delete); font-size: 0.8rem; margin-top: 6px; display: none; }

    /* CANVAS ELEMENTS */
    #canvas-viewport { flex: 1; position: relative; background-color: var(--bg-color); overflow: hidden; user-select: none; cursor: grab; }
    #canvas-viewport.is-panning { cursor: grabbing !important; }
    #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform-origin: 0 0; }
    #canvas-bg-grid { position: absolute; top: -10000px; left: -10000px; width: 20000px; height: 20000px; background-image: radial-gradient(rgba(255, 255, 255, 0.1) 1px, transparent 1px); background-size: 24px 24px; pointer-events: none; }
    #svg-layer { position: absolute; top: 0; left: 0; width: 10000px; height: 10000px; pointer-events: none; z-index: 5; }
    .node-box { position: absolute; width: 180px; height: 100px; border: 1.5px solid var(--node-border); border-radius: 12px; background-color: var(--node-bg); display: flex; align-items: center; justify-content: center; padding: 12px; box-shadow: 0 4px 14px rgba(0,0,0,0.5); z-index: 10; cursor: move; }
    .node-box.selected { border-color: var(--accent-blue) !important; box-shadow: 0 0 15px rgba(52, 131, 250, 0.7) !important; }
    .node-text { width: 100%; height: 100%; outline: none; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 0.95rem; color: var(--text-main); word-break: break-word; cursor: text; }
    .node-text:empty:before { content: attr(data-placeholder); color: var(--text-sub); opacity: 0.6; }
    .node-box .remove-btn { position: absolute; top: -8px; right: -8px; background: var(--arrow-delete); color: white; border-radius: 50%; width: 20px; height: 20px; display: none; align-items: center; justify-content: center; font-size: 10px; cursor: pointer; z-index: 25; }
    body:not(.connect-mode) .node-box:hover .remove-btn { display: flex; }
    .anchor-point { position: absolute; width: 10px; height: 10px; background-color: var(--node-bg); border: 2px solid var(--anchor-color); border-radius: 50%; z-index: 40; cursor: crosshair; display: none; }
    body.connect-mode .anchor-point { display: block; }
    .anchor-point:hover, .anchor-point.selected-start { background-color: var(--anchor-color); transform: scale(1.4); }
    .anchor-point[data-dir="top"] { top: -5px; left: calc(50% - 5px); }
    .anchor-point[data-dir="right"] { top: calc(50% - 5px); right: -5px; }
    .anchor-point[data-dir="bottom"] { bottom: -5px; left: calc(50% - 5px); }
    .anchor-point[data-dir="left"] { top: calc(50% - 5px); left: -5px; }
    .arrow-group { cursor: pointer; }
    .arrow-hitbox { stroke: transparent; stroke-width: 16px; fill: none; pointer-events: stroke; }
    .arrow-path { stroke: var(--arrow-color); stroke-width: 2.5px; stroke-linecap: round; stroke-linejoin: round; fill: none; pointer-events: none; }
    .arrow-group:hover .arrow-path { stroke: var(--arrow-delete); stroke-width: 3px; marker-end: url(#arrowhead-red); }
  </style>
</head>
<body>

  <!-- TELA 1: CAPA -->
  <div id="home-screen" class="screen active" onclick="showScreen('folders-screen')">
    <div class="chub-card">
      <h1>CHUB</h1>
    </div>
  </div>

  <!-- TELA 2: GERENCIADOR DE PASTAS -->
  <div id="folders-screen" class="screen">
    <div class="folders-header">
      <div class="folders-title">
        <h2>Gerenciador de Projetos</h2>
        <p>Selecione uma pasta ou crie uma nova para trabalhar</p>
      </div>
      <button class="btn btn-primary" onclick="openFolderModal()">+ Nova Pasta</button>
    </div>
    <div class="folders-grid" id="folders-grid"></div>
  </div>

  <!-- TELA 3: FLUXOGRAMA -->
  <div id="flowchart-screen" class="screen">
    <header>
      <div class="header-left">
        <div class="logo" style="font-weight: bold; letter-spacing: 2px;">CHUB</div>
        <div class="active-folder-tag" id="active-folder-tag">Pasta</div>
      </div>
      <div class="toolbar">
        <button class="btn" onclick="addNode()">+ Adicionar Retângulo</button>
        <button class="btn" id="connect-btn" onclick="toggleConnectMode()">➔ Conectar Blocos</button>
        <button class="btn btn-save" onclick="requestAuth('save')">💾 Salvar na Nuvem</button>
        <span class="zoom-indicator" id="zoom-indicator">100%</span>
        <span class="db-status" id="db-status"></span>
      </div>
      <button class="btn btn-back" onclick="showScreen('folders-screen')">← Pastas</button>
    </header>

    <main id="canvas-viewport" onclick="deselectAll(event)">
      <div id="canvas-container">
        <div id="canvas-bg-grid"></div>
        <svg id="svg-layer">
          <defs>
            <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
              <path d="M 0 0 L 8 4 L 0 8 Z" fill="#6c7280" />
            </marker>
            <marker id="arrowhead-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
              <path d="M 0 0 L 8 4 L 0 8 Z" fill="#ff4d4d" />
            </marker>
          </defs>
        </svg>
      </div>
    </main>
  </div>

  <!-- MODAL DE CRIAR PASTA -->
  <div class="modal-overlay" id="folder-modal">
    <div class="modal">
      <h3>Criar Nova Pasta</h3>
      <p>Defina o nome e a categoria para organizar</p>
      <div class="form-group">
        <label>Nome da Pasta</label>
        <input type="text" id="folder-name-input" placeholder="Ex: Arquitetura de API">
      </div>
      <div class="form-group">
        <label>Categoria / Assunto</label>
        <input type="text" id="folder-category-input" placeholder="Ex: Backend, UI/UX, Vendas">
      </div>
      <div class="modal-actions">
        <button class="btn btn-back" onclick="closeFolderModal()">Cancelar</button>
        <button class="btn btn-primary" onclick="createFolder()">Criar Pasta</button>
      </div>
    </div>
  </div>

  <!-- MODAL DE AUTENTICAÇÃO / SENHA -->
  <div class="modal-overlay" id="auth-modal">
    <div class="modal">
      <h3 id="auth-title">Autenticação Requerida</h3>
      <p id="auth-desc">Digite a senha para confirmar a ação</p>
      <div class="form-group">
        <label>Senha de Acesso</label>
        <input type="password" id="auth-pin-input" placeholder="••••">
        <div class="error-msg" id="auth-error">Senha incorreta. Tente novamente.</div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-back" onclick="closeAuthModal()">Cancelar</button>
        <button class="btn btn-primary" id="auth-confirm-btn" onclick="confirmAuth()">Confirmar</button>
      </div>
    </div>
  </div>

  <script>
    const SECURITY_PIN = "1234";

    const DB_CONFIG = {
      binId: "6a8f27b1da38895dfe143e4e",
      apiKey: "$2a$10$lrjAB/pBHe0LPTuQDuWNyO/paWbsAKeQaJ4hiJFauUbLL5/y4svHy"
    };

    let globalStore = { folders: [] };
    let currentFolderId = null;
    let pendingAction = null;

    let nodeCount = 0, arrowCount = 0, arrows = [];
    let isConnectMode = false, selectedStartAnchor = null, selectedNode = null;
    let zoomLevel = 1, panX = 0, panY = 0, isPanning = false, startPanX = 0, startPanY = 0;

    const viewport = document.getElementById('canvas-viewport');
    const container = document.getElementById('canvas-container');
    const zoomIndicator = document.getElementById('zoom-indicator');
    const dbStatus = document.getElementById('db-status');

    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
      if (screenId === 'folders-screen') {
        loadFromDatabase();
      }
    }

    /* SISTEMA DE AUTENTICAÇÃO COM SENHA */
    function requestAuth(actionType, payload = null) {
      pendingAction = { type: actionType, payload: payload };
      const authTitle = document.getElementById('auth-title');
      const authDesc = document.getElementById('auth-desc');
      const errorMsg = document.getElementById('auth-error');
      
      errorMsg.style.display = 'none';
      document.getElementById('auth-pin-input').value = '';

      if (actionType === 'delete') {
        authTitle.textContent = "Excluir Pasta";
        authDesc.textContent = "Digite a senha para confirmar a exclusão desta pasta.";
      } else if (actionType === 'save') {
        authTitle.textContent = "Salvar Alterações";
        authDesc.textContent = "Digite a senha para atualizar os dados na nuvem.";
      }

      document.getElementById('auth-modal').classList.add('active');
      document.getElementById('auth-pin-input').focus();
    }

    function closeAuthModal() {
      document.getElementById('auth-modal').classList.remove('active');
      pendingAction = null;
    }

    function confirmAuth() {
      const pin = document.getElementById('auth-pin-input').value;
      const errorMsg = document.getElementById('auth-error');

      if (pin === SECURITY_PIN) {
        closeAuthModal();
        if (pendingAction) {
          if (pendingAction.type === 'delete') {
            executeDeleteFolder(pendingAction.payload);
          } else if (pendingAction.type === 'save') {
            saveToDatabase();
          }
        }
      } else {
        errorMsg.style.display = 'block';
      }
    }

    document.getElementById('auth-pin-input').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') confirmAuth();
    });

    /* SISTEMA DE PASTAS */
    function openFolderModal() {
      document.getElementById('folder-modal').classList.add('active');
      document.getElementById('folder-name-input').focus();
    }

    function closeFolderModal() {
      document.getElementById('folder-modal').classList.remove('active');
      document.getElementById('folder-name-input').value = '';
      document.getElementById('folder-category-input').value = '';
    }

    function createFolder() {
      const name = document.getElementById('folder-name-input').value.trim();
      const category = document.getElementById('folder-category-input').value.trim() || 'Geral';
      if (!name) return alert('Por favor, digite um nome para a pasta.');

      const newFolder = {
        id: 'folder_' + Date.now(),
        name: name,
        category: category,
        diagramData: { nodeCount: 0, arrowCount: 0, zoomLevel: 1, panX: 0, panY: 0, nodes: [], arrows: [] }
      };

      if (!globalStore.folders) globalStore.folders = [];
      globalStore.folders.push(newFolder);
      closeFolderModal();
      renderFolders();
      saveToDatabaseDirect();
    }

    function deleteFolder(e, folderId) {
      e.stopPropagation();
      requestAuth('delete', folderId);
    }

    function executeDeleteFolder(folderId) {
      globalStore.folders = globalStore.folders.filter(f => f.id !== folderId);
      renderFolders();
      saveToDatabaseDirect();
    }

    function openFolder(folderId) {
      currentFolderId = folderId;
      const folder = globalStore.folders.find(f => f.id === folderId);
      if (!folder) return;

      document.getElementById('active-folder-tag').textContent = `${folder.category.toUpperCase()} / ${folder.name}`;
      loadState(folder.diagramData);
      showScreen('flowchart-screen');
    }

    function renderFolders() {
      const grid = document.getElementById('folders-grid');
      grid.innerHTML = '';

      if (!globalStore.folders || globalStore.folders.length === 0) {
        grid.innerHTML = `<p style="color: var(--text-sub); grid-column: 1/-1; text-align: center; padding: 40px;">Nenhuma pasta encontrada. Crie a sua primeira pasta acima!</p>`;
        return;
      }

      globalStore.folders.forEach(folder => {
        const card = document.createElement('div');
        card.className = 'folder-card';
        card.onclick = () => openFolder(folder.id);
        card.innerHTML = `
          <div class="folder-top">
            <div class="folder-icon">📁</div>
            <button class="folder-delete" onclick="deleteFolder(event, '${folder.id}')">✕</button>
          </div>
          <div class="folder-info">
            <div class="folder-name">${folder.name}</div>
            <span class="folder-category">${folder.category}</span>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    /* INTEGRACÃO COM BANCO DE DADOS */
    async function loadFromDatabase() {
      dbStatus.textContent = "Carregando...";
      try {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${DB_CONFIG.binId}/latest`, {
          headers: { "X-Master-Key": DB_CONFIG.apiKey }
        });
        if (res.ok) {
          const data = await res.json();
          globalStore = data.record || { folders: [] };
          if (!globalStore.folders) globalStore.folders = [];
          renderFolders();
          dbStatus.textContent = "Pronto!";
        }
      } catch (e) {
        dbStatus.textContent = "Erro de Conexão";
      }
    }

    function saveToDatabase() {
      if (currentFolderId) {
        const folder = globalStore.folders.find(f => f.id === currentFolderId);
        if (folder) {
          folder.diagramData = getState();
        }
      }
      saveToDatabaseDirect();
    }

    async function saveToDatabaseDirect() {
      dbStatus.textContent = "Salvando...";
      try {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${DB_CONFIG.binId}`, {
          method: "PUT",
          headers: {
            "Content-Type": "application/json",
            "X-Master-Key": DB_CONFIG.apiKey
          },
          body: JSON.stringify(globalStore)
        });
        
        if (res.ok) {
          dbStatus.textContent = "Salvo com sucesso!";
        } else {
          dbStatus.textContent = "Erro ao Salvar";
        }
      } catch (e) {
        dbStatus.textContent = "Erro de Conexão";
      }
    }

    /* MOTOR DO CANVAS & FLUXOGRAMA */
    function applyTransform() {
      container.style.transform = `translate(${panX}px, ${panY}px) scale(${zoomLevel})`;
      zoomIndicator.textContent = `${Math.round(zoomLevel * 100)}%`;
    }

    viewport.addEventListener('wheel', (e) => {
      e.preventDefault();
      const prevZoom = zoomLevel;
      zoomLevel = e.deltaY < 0 ? Math.min(zoomLevel + 0.08, 3.0) : Math.max(zoomLevel - 0.08, 0.2);
      const rect = viewport.getBoundingClientRect();
      const mouseX = e.clientX - rect.left, mouseY = e.clientY - rect.top;
      panX = mouseX - (mouseX - panX) * (zoomLevel / prevZoom);
      panY = mouseY - (mouseY - panY) * (zoomLevel / prevZoom);
      applyTransform();
    }, { passive: false });

    viewport.addEventListener('mousedown', (e) => {
      if (['canvas-viewport', 'canvas-bg-grid', 'canvas-container'].includes(e.target.id)) {
        isPanning = true; startPanX = e.clientX - panX; startPanY = e.clientY - panY;
        viewport.classList.add('is-panning');
      }
    });
    window.addEventListener('mousemove', (e) => { if (isPanning) { panX = e.clientX - startPanX; panY = e.clientY - startPanY; applyTransform(); } });
    window.addEventListener('mouseup', () => { isPanning = false; viewport.classList.remove('is-panning'); });

    function selectNode(node) {
      if (selectedNode) selectedNode.classList.remove('selected');
      selectedNode = node;
      if (selectedNode) selectedNode.classList.add('selected');
    }

    function deselectAll(e) {
      if (isPanning || (e && (e.target.closest('.node-box') || e.target.closest('.btn')))) return;
      if (selectedNode) { selectedNode.classList.remove('selected'); selectedNode = null; }
    }

    function addNode() {
      nodeCount++;
      const node = document.createElement('div');
      node.className = 'node-box';
      node.id = `node-${nodeCount}`;
      const rect = viewport.getBoundingClientRect();
      node.style.left = `${(-panX + rect.width / 2) / zoomLevel - 90 + (nodeCount * 10)}px`;
      node.style.top = `${(-panY + rect.height / 2) / zoomLevel - 50 + (nodeCount * 10)}px`;
      node.innerHTML = `
        <div class="remove-btn" onclick="removeNode('node-${nodeCount}')">✕</div>
        <div class="anchor-point" data-dir="top"></div><div class="anchor-point" data-dir="right"></div>
        <div class="anchor-point" data-dir="bottom"></div><div class="anchor-point" data-dir="left"></div>
        <div class="node-text" contenteditable="true" data-placeholder="Digite aqui..."></div>
      `;
      container.appendChild(node);
      makeDraggable(node); bindAnchors(node); selectNode(node);
      return node;
    }

    function removeNode(nodeId) {
      const el = document.getElementById(nodeId);
      if (el) el.remove();
      arrows = arrows.filter(a => { if (a.fromNodeId === nodeId || a.toNodeId === nodeId) { a.element.remove(); return false; } return true; });
    }

    function makeDraggable(elmnt) {
      let p1 = 0, p2 = 0, p3 = 0, p4 = 0;
      elmnt.onmousedown = (e) => {
        selectNode(elmnt);
        if (e.target.classList.contains('node-text') || e.target.classList.contains('remove-btn') || e.target.classList.contains('anchor-point')) return;
        p3 = e.clientX; p4 = e.clientY;
        document.onmouseup = () => { document.onmouseup = null; document.onmousemove = null; };
        document.onmousemove = (e) => {
          p1 = (p3 - e.clientX) / zoomLevel; p2 = (p4 - e.clientY) / zoomLevel;
          p3 = e.clientX; p4 = e.clientY;
          elmnt.style.top = (elmnt.offsetTop - p2) + "px";
          elmnt.style.left = (elmnt.offsetLeft - p1) + "px";
          updateArrows();
        };
      };
    }

    function toggleConnectMode() {
      isConnectMode = !isConnectMode;
      document.getElementById('connect-btn').classList.toggle('active', isConnectMode);
      document.body.classList.toggle('connect-mode', isConnectMode);
    }

    function bindAnchors(node) {
      node.querySelectorAll('.anchor-point').forEach(anchor => {
        anchor.onclick = (e) => {
          e.stopPropagation();
          const dir = anchor.getAttribute('data-dir');
          if (!selectedStartAnchor) {
            selectedStartAnchor = { nodeId: node.id, dir: dir, el: anchor };
            anchor.classList.add('selected-start');
            if (!isConnectMode) toggleConnectMode();
          } else {
            createArrow(selectedStartAnchor.nodeId, selectedStartAnchor.dir, node.id, dir);
            selectedStartAnchor.el.classList.remove('selected-start');
            selectedStartAnchor = null;
          }
        };
      });
    }

    function createArrow(fromId, fromDir, toId, toDir, customId = null) {
      arrowCount++;
      const id = customId || `arrow-${arrowCount}`;
      const svg = document.getElementById('svg-layer');
      const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
      g.setAttribute("class", "arrow-group"); g.setAttribute("id", id);
      const hitbox = document.createElementNS("http://www.w3.org/2000/svg", "path");
      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      hitbox.setAttribute("class", "arrow-hitbox"); path.setAttribute("class", "arrow-path"); path.setAttribute("marker-end", "url(#arrowhead)");
      g.appendChild(hitbox); g.appendChild(path); svg.appendChild(g);
      const obj = { id, element: g, path, hitbox, fromNodeId: fromId, fromDir, toNodeId: toId, toDir };
      hitbox.onclick = () => { g.remove(); arrows = arrows.filter(a => a.id !== id); };
      arrows.push(obj); updateArrows();
    }

    function getAnchorCoords(nodeEl, dir) {
      const l = nodeEl.offsetLeft, t = nodeEl.offsetTop, w = nodeEl.offsetWidth, h = nodeEl.offsetHeight;
      if (dir === 'top') return { x: l + w / 2, y: t };
      if (dir === 'right') return { x: l + w, y: t + h / 2 };
      if (dir === 'bottom') return { x: l + w / 2, y: t + h };
      return { x: l, y: t + h / 2 };
    }

    function updateArrows() {
      arrows.forEach(a => {
        const f = document.getElementById(a.fromNodeId), t = document.getElementById(a.toNodeId);
        if (!f || !t) return;
        const s = getAnchorCoords(f, a.fromDir), e = getAnchorCoords(t, a.toDir);
        const d = `M ${s.x} ${s.y} L ${e.x} ${e.y}`;
        a.path.setAttribute("d", d); a.hitbox.setAttribute("d", d);
      });
    }

    function getState() {
      const nodes = Array.from(document.querySelectorAll('.node-box')).map(n => ({
        id: n.id, left: n.style.left, top: n.style.top, text: n.querySelector('.node-text').innerHTML
      }));
      const arrowsData = arrows.map(a => ({ id: a.id, fromNodeId: a.fromNodeId, fromDir: a.fromDir, toNodeId: a.toNodeId, toDir: a.toDir }));
      return { nodeCount, arrowCount, zoomLevel, panX, panY, nodes, arrows: arrowsData };
    }

    function loadState(s) {
      document.querySelectorAll('.node-box').forEach(n => n.remove());
      arrows.forEach(a => a.element.remove());
      arrows = [];
      if (!s) return;
      nodeCount = s.nodeCount || 0; arrowCount = s.arrowCount || 0;
      zoomLevel = s.zoomLevel || 1; panX = s.panX || 0; panY = s.panY || 0;
      applyTransform();

      if (s.nodes) s.nodes.forEach(n => {
        const node = addNode(); node.id = n.id; node.style.left = n.left; node.style.top = n.top;
        node.querySelector('.node-text').innerHTML = n.text || '';
      });
      if (s.arrows) s.arrows.forEach(a => createArrow(a.fromNodeId, a.fromDir, a.toNodeId, a.toDir, a.id));
    }
  </script>
</body>
</html>
