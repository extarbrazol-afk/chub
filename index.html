<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CHUB - Flowchart Studio</title>
  <style>
    :root {
      --bg-color: #0b0c10;
      --card-bg: #15171e;
      --card-border: #262933;
      --text-main: #f0f2f5;
      --text-sub: #8a8f9d;
      --node-bg: #1c1f2b;
      --node-border: #3b3f52;
      --accent-blue: #3483fa;
      --arrow-color: #6c7280;
      --arrow-delete: #ff4d4d;
      --anchor-color: #00ffcc;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    #home-screen { flex: 1; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .chub-card { background-color: var(--card-bg); border: 1.5px solid var(--card-border); width: 280px; height: 160px; border-radius: 16px; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 30px rgba(0,0,0,0.6); }
    .chub-card h1 { font-size: 2.2rem; font-weight: 700; letter-spacing: 4px; color: var(--text-main); }
    #flowchart-screen { display: none; flex: 1; flex-direction: column; opacity: 0; transition: opacity 0.4s ease; height: 100vh; }
    header { padding: 12px 24px; border-bottom: 1px solid var(--card-border); display: flex; align-items: center; justify-content: space-between; background-color: rgba(21, 23, 30, 0.95); z-index: 100; }
    .toolbar { display: flex; gap: 10px; align-items: center; }
    .zoom-indicator, .github-status { font-size: 0.85rem; color: var(--text-sub); margin-left: 10px; }
    .github-status { color: #00ffcc; font-weight: bold; }
    .btn { background: var(--node-bg); border: 1px solid var(--card-border); color: var(--text-main); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; font-weight: 500; }
    .btn:hover, .btn.active { border-color: var(--accent-blue); background: #252938; }
    .btn-save { border-color: #2e7d32; background: #1b5e20; }
    .btn-save:hover { background: #2e7d32; }
    .btn-back { background: transparent; border: 1px solid var(--card-border); color: var(--text-sub); }
    #canvas-viewport { flex: 1; position: relative; background-color: var(--bg-color); overflow: hidden; user-select: none; cursor: grab; }
    #canvas-viewport.is-panning { cursor: grabbing !important; }
    #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform-origin: 0 0; }
    #canvas-bg-grid { position: absolute; top: -10000px; left: -10000px; width: 20000px; height: 20000px; background-image: radial-gradient(rgba(255, 255, 255, 0.1) 1px, transparent 1px); background-size: 24px 24px; pointer-events: none; }
    #svg-layer { position: absolute; top: 0; left: 0; width: 10000px; height: 10000px; pointer-events: none; z-index: 5; }
    .node-box { position: absolute; width: 180px; height: 100px; border: 1.5px solid var(--node-border); border-radius: 12px; background-color: var(--node-bg); display: flex; align-items: center; justify-content: center; padding: 12px; box-shadow: 0 4px 14px rgba(0,0,0,0.5); z-index: 10; cursor: move; }
    .node-box.selected { border-color: var(--accent-blue) !important; box-shadow: 0 0 15px rgba(52, 131, 250, 0.7) !important; }
    .node-text { width: 100%; height: 100%; outline: none; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 0.95rem; color: var(--text-main); word-break: break-word; cursor: text; }
    .node-text:empty:before { content: attr(data-placeholder); color: var(--text-sub); opacity: 0.6; }
    .node-box .remove-btn { position: absolute; top: -8px; right: -8px; background: var(--arrow-delete); color: white; border-radius: 50%; width: 20px; height: 20px; display: none; align-items: center; justify-content: center; font-size: 10px; cursor: pointer; z-index: 25; }
    body:not(.connect-mode) .node-box:hover .remove-btn { display: flex; }
    .anchor-point { position: absolute; width: 10px; height: 10px; background-color: var(--node-bg); border: 2px solid var(--anchor-color); border-radius: 50%; z-index: 40; cursor: crosshair; display: none; }
    body.connect-mode .anchor-point { display: block; }
    .anchor-point:hover, .anchor-point.selected-start { background-color: var(--anchor-color); transform: scale(1.4); }
    .anchor-point[data-dir="top"] { top: -5px; left: calc(50% - 5px); }
    .anchor-point[data-dir="right"] { top: calc(50% - 5px); right: -5px; }
    .anchor-point[data-dir="bottom"] { bottom: -5px; left: calc(50% - 5px); }
    .anchor-point[data-dir="left"] { top: calc(50% - 5px); left: -5px; }
    .arrow-group { cursor: pointer; }
    .arrow-hitbox { stroke: transparent; stroke-width: 16px; fill: none; pointer-events: stroke; }
    .arrow-path { stroke: var(--arrow-color); stroke-width: 2.5px; stroke-linecap: round; stroke-linejoin: round; fill: none; pointer-events: none; }
    .arrow-group:hover .arrow-path { stroke: var(--arrow-delete); stroke-width: 3px; marker-end: url(#arrowhead-red); }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div id="home-screen" onclick="openFlowchart()">
    <div class="chub-card">
      <h1>CHUB</h1>
    </div>
  </div>

  <div id="flowchart-screen">
    <header>
      <div class="logo">CHUB</div>
      <div class="toolbar">
        <button class="btn" onclick="addNode()">+ Adicionar Retângulo</button>
        <button class="btn" id="connect-btn" onclick="toggleConnectMode()">➔ Conectar Blocos</button>
        <button class="btn btn-save" onclick="saveToGitHub()">💾 Salvar no GitHub</button>
        <span class="zoom-indicator" id="zoom-indicator">100%</span>
        <span class="github-status" id="github-status"></span>
      </div>
      <button class="btn btn-back" onclick="closeFlowchart()">← Voltar</button>
    </header>

    <main id="canvas-viewport" onclick="deselectAll(event)">
      <div id="canvas-container">
        <div id="canvas-bg-grid"></div>
        <svg id="svg-layer">
          <defs>
            <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
              <path d="M 0 0 L 8 4 L 0 8 Z" fill="#6c7280" />
            </marker>
            <marker id="arrowhead-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
              <path d="M 0 0 L 8 4 L 0 8 Z" fill="#ff4d4d" />
            </marker>
          </defs>
        </svg>
      </div>
    </main>
  </div>

  <script>
    const GITHUB_CONFIG = { user: "extarbrazol-afk", repo: "chub", filePath: "dados.json" };
    
    // Token em Base64 configurado:
    const EMBEDDED_TOKEN_B64 = "Z2hwX0RkRE5PY3RqN0s2SE9IUXlvS25tbUpLeG5tTTVUVzQ4ZDh0Qw==";

    function getActiveToken() {
      try { return atob(EMBEDDED_TOKEN_B64).trim(); } catch(e) { return ""; }
    }

    let githubToken = getActiveToken();
    let fileSHA = "";
    let nodeCount = 0, arrowCount = 0, arrows = [];
    let isConnectMode = false, selectedStartAnchor = null, selectedNode = null;
    let zoomLevel = 1, panX = 0, panY = 0, isPanning = false, startPanX = 0, startPanY = 0;

    const viewport = document.getElementById('canvas-viewport');
    const container = document.getElementById('canvas-container');
    const zoomIndicator = document.getElementById('zoom-indicator');
    const githubStatus = document.getElementById('github-status');

    function applyTransform() {
      container.style.transform = `translate(${panX}px, ${panY}px) scale(${zoomLevel})`;
      zoomIndicator.textContent = `${Math.round(zoomLevel * 100)}%`;
    }

    viewport.addEventListener('wheel', (e) => {
      e.preventDefault();
      const prevZoom = zoomLevel;
      zoomLevel = e.deltaY < 0 ? Math.min(zoomLevel + 0.08, 3.0) : Math.max(zoomLevel - 0.08, 0.2);
      const rect = viewport.getBoundingClientRect();
      const mouseX = e.clientX - rect.left, mouseY = e.clientY - rect.top;
      panX = mouseX - (mouseX - panX) * (zoomLevel / prevZoom);
      panY = mouseY - (mouseY - panY) * (zoomLevel / prevZoom);
      applyTransform();
    }, { passive: false });

    viewport.addEventListener('mousedown', (e) => {
      if (['canvas-viewport', 'canvas-bg-grid', 'canvas-container'].includes(e.target.id)) {
        isPanning = true; startPanX = e.clientX - panX; startPanY = e.clientY - panY;
        viewport.classList.add('is-panning');
      }
    });
    window.addEventListener('mousemove', (e) => { if (isPanning) { panX = e.clientX - startPanX; panY = e.clientY - startPanY; applyTransform(); } });
    window.addEventListener('mouseup', () => { isPanning = false; viewport.classList.remove('is-panning'); });

    function openFlowchart() {
      document.getElementById('home-screen').style.opacity = '0';
      setTimeout(() => {
        document.getElementById('home-screen').classList.add('hidden');
        const screen = document.getElementById('flowchart-screen');
        screen.style.display = 'flex';
        setTimeout(() => { screen.style.opacity = '1'; loadFromGitHub(); }, 50);
      }, 300);
    }

    function closeFlowchart() {
      const screen = document.getElementById('flowchart-screen');
      screen.style.opacity = '0';
      setTimeout(() => {
        screen.style.display = 'none';
        const home = document.getElementById('home-screen');
        home.classList.remove('hidden');
        setTimeout(() => home.style.opacity = '1', 50);
      }, 300);
    }

    function selectNode(node) {
      if (selectedNode) selectedNode.classList.remove('selected');
      selectedNode = node;
      if (selectedNode) selectedNode.classList.add('selected');
    }

    function deselectAll(e) {
      if (isPanning || (e && (e.target.closest('.node-box') || e.target.closest('.btn')))) return;
      if (selectedNode) { selectedNode.classList.remove('selected'); selectedNode = null; }
    }

    function addNode() {
      nodeCount++;
      const node = document.createElement('div');
      node.className = 'node-box';
      node.id = `node-${nodeCount}`;
      const rect = viewport.getBoundingClientRect();
      node.style.left = `${(-panX + rect.width / 2) / zoomLevel - 90 + (nodeCount * 10)}px`;
      node.style.top = `${(-panY + rect.height / 2) / zoomLevel - 50 + (nodeCount * 10)}px`;
      node.innerHTML = `
        <div class="remove-btn" onclick="removeNode('node-${nodeCount}')">✕</div>
        <div class="anchor-point" data-dir="top"></div><div class="anchor-point" data-dir="right"></div>
        <div class="anchor-point" data-dir="bottom"></div><div class="anchor-point" data-dir="left"></div>
        <div class="node-text" contenteditable="true" data-placeholder="Digite aqui..."></div>
      `;
      container.appendChild(node);
      makeDraggable(node); bindAnchors(node); selectNode(node);
      return node;
    }

    function removeNode(nodeId) {
      const el = document.getElementById(nodeId);
      if (el) el.remove();
      arrows = arrows.filter(a => { if (a.fromNodeId === nodeId || a.toNodeId === nodeId) { a.element.remove(); return false; } return true; });
    }

    function makeDraggable(elmnt) {
      let p1 = 0, p2 = 0, p3 = 0, p4 = 0;
      elmnt.onmousedown = (e) => {
        selectNode(elmnt);
        if (e.target.classList.contains('node-text') || e.target.classList.contains('remove-btn') || e.target.classList.contains('anchor-point')) return;
        p3 = e.clientX; p4 = e.clientY;
        document.onmouseup = () => { document.onmouseup = null; document.onmousemove = null; };
        document.onmousemove = (e) => {
          p1 = (p3 - e.clientX) / zoomLevel; p2 = (p4 - e.clientY) / zoomLevel;
          p3 = e.clientX; p4 = e.clientY;
          elmnt.style.top = (elmnt.offsetTop - p2) + "px";
          elmnt.style.left = (elmnt.offsetLeft - p1) + "px";
          updateArrows();
        };
      };
    }

    function toggleConnectMode() {
      isConnectMode = !isConnectMode;
      document.getElementById('connect-btn').classList.toggle('active', isConnectMode);
      document.body.classList.toggle('connect-mode', isConnectMode);
    }

    function bindAnchors(node) {
      node.querySelectorAll('.anchor-point').forEach(anchor => {
        anchor.onclick = (e) => {
          e.stopPropagation();
          const dir = anchor.getAttribute('data-dir');
          if (!selectedStartAnchor) {
            selectedStartAnchor = { nodeId: node.id, dir: dir, el: anchor };
            anchor.classList.add('selected-start');
            if (!isConnectMode) toggleConnectMode();
          } else {
            createArrow(selectedStartAnchor.nodeId, selectedStartAnchor.dir, node.id, dir);
            selectedStartAnchor.el.classList.remove('selected-start');
            selectedStartAnchor = null;
          }
        };
      });
    }

    function createArrow(fromId, fromDir, toId, toDir, customId = null) {
      arrowCount++;
      const id = customId || `arrow-${arrowCount}`;
      const svg = document.getElementById('svg-layer');
      const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
      g.setAttribute("class", "arrow-group"); g.setAttribute("id", id);
      const hitbox = document.createElementNS("http://www.w3.org/2000/svg", "path");
      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      hitbox.setAttribute("class", "arrow-hitbox"); path.setAttribute("class", "arrow-path"); path.setAttribute("marker-end", "url(#arrowhead)");
      g.appendChild(hitbox); g.appendChild(path); svg.appendChild(g);
      const obj = { id, element: g, path, hitbox, fromNodeId: fromId, fromDir, toNodeId: toId, toDir };
      hitbox.onclick = () => { g.remove(); arrows = arrows.filter(a => a.id !== id); };
      arrows.push(obj); updateArrows();
    }

    function getAnchorCoords(nodeEl, dir) {
      const l = nodeEl.offsetLeft, t = nodeEl.offsetTop, w = nodeEl.offsetWidth, h = nodeEl.offsetHeight;
      if (dir === 'top') return { x: l + w / 2, y: t };
      if (dir === 'right') return { x: l + w, y: t + h / 2 };
      if (dir === 'bottom') return { x: l + w / 2, y: t + h };
      return { x: l, y: t + h / 2 };
    }

    function updateArrows() {
      arrows.forEach(a => {
        const f = document.getElementById(a.fromNodeId), t = document.getElementById(a.toNodeId);
        if (!f || !t) return;
        const s = getAnchorCoords(f, a.fromDir), e = getAnchorCoords(t, a.toDir);
        const d = `M ${s.x} ${s.y} L ${e.x} ${e.y}`;
        a.path.setAttribute("d", d); a.hitbox.setAttribute("d", d);
      });
    }

    async function loadFromGitHub() {
      if (!githubToken) {
        githubStatus.textContent = "Token não configurado";
        return;
      }
      githubStatus.textContent = "Conectando...";
      const url = `https://api.github.com/repos/${GITHUB_CONFIG.user}/${GITHUB_CONFIG.repo}/contents/${GITHUB_CONFIG.filePath}`;
      try {
        const res = await fetch(url, { headers: { "Authorization": `token ${githubToken}` } });
        if (res.ok) {
          const data = await res.json();
          fileSHA = data.sha;
          const state = JSON.parse(decodeURIComponent(escape(atob(data.content))));
          loadState(state);
          githubStatus.textContent = "Pronto!";
        } else if (res.status === 404) {
          githubStatus.textContent = "Novo Arquivo";
        } else if (res.status === 401) {
          githubStatus.textContent = "Token Inválido/Expirado";
        }
      } catch (e) { githubStatus.textContent = "Erro de Conexão"; }
    }

    async function saveToGitHub() {
      if (!githubToken) return alert("Token não encontrado!");
      githubStatus.textContent = "Salvando...";
      const url = `https://api.github.com/repos/${GITHUB_CONFIG.user}/${GITHUB_CONFIG.repo}/contents/${GITHUB_CONFIG.filePath}`;
      const state = getState();
      const content = btoa(unescape(encodeURIComponent(JSON.stringify(state, null, 2))));
      try {
        const body = { message: "Atualização de equipe via CHUB", content };
        if (fileSHA) body.sha = fileSHA;
        const res = await fetch(url, { method: "PUT", headers: { "Authorization": `token ${githubToken}`, "Content-Type": "application/json" }, body: JSON.stringify(body) });
        if (res.ok) {
          const resData = await res.json();
          fileSHA = resData.content.sha;
          githubStatus.textContent = "Salvo com sucesso!";
        } else {
          githubStatus.textContent = "Erro ao Salvar";
        }
      } catch (e) { githubStatus.textContent = "Erro de conexão"; }
    }

    function getState() {
      const nodes = Array.from(document.querySelectorAll('.node-box')).map(n => ({
        id: n.id, left: n.style.left, top: n.style.top, text: n.querySelector('.node-text').innerHTML
      }));
      const arrowsData = arrows.map(a => ({ id: a.id, fromNodeId: a.fromNodeId, fromDir: a.fromDir, toNodeId: a.toNodeId, toDir: a.toDir }));
      return { nodeCount, arrowCount, zoomLevel, panX, panY, nodes, arrows: arrowsData };
    }

    function loadState(s) {
      if (!s) return;
      document.querySelectorAll('.node-box').forEach(n => n.remove());
      arrows.forEach(a => a.element.remove());
      arrows = [];
      nodeCount = s.nodeCount || 0; arrowCount = s.arrowCount || 0;
      if (s.nodes) s.nodes.forEach(n => {
        const node = addNode(); node.id = n.id; node.style.left = n.left; node.style.top = n.top;
        node.querySelector('.node-text').innerHTML = n.text || '';
      });
      if (s.arrows) s.arrows.forEach(a => createArrow(a.fromNodeId, a.fromDir, a.toNodeId, a.toDir, a.id));
    }
  </script>
</body>
</html>
